aid: precision-neuroscience
name: Precision Neuroscience
description: >-
  Precision Neuroscience is a New York City brain-computer interface company founded in
  2021 by Benjamin Rapoport, Michael Mager, Demetrios Papageorgiou and Mark Hettick, with
  additional sites in Santa Clara, California and Addison, Texas. Its product is the
  Layer 7 Cortical Interface, a thin-film microelectrode array that lies on the surface of
  the cortex rather than penetrating brain tissue, and is designed to be removable and
  upgradable. The array received FDA 510(k) clearance for recording, monitoring and
  stimulating on the brain surface for implantation durations of up to 30 days, and the
  company reports 95+ clinical study participants across 15+ hospital partnerships —
  Mount Sinai, Penn Medicine, Johns Hopkins, Mass General Brigham, Northwestern, Emory,
  Barrow Neurological Institute and others — plus a strategic partnership with Medtronic.
  Precision sells a regulated medical device, not software services. It runs no developer
  program: no public API, SDK, webhooks, developer portal or machine-readable
  specification is published anywhere on its domain. Its only public engineering surface
  is a verified GitHub organization whose single public repository is an Apache-2.0
  research notebook accompanying a 2025 neural-decoding result.
